<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b7f701">
    <title>Accueil — Swipe</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-swipe">

    <div class="carte">
        <div class="photo-box" id="carte-photo">
            <img src="photos/celeste.jpg" alt="" class="photo-suivante">
            <h1 class="nom nom-suivant">
                <img src="photos/Vector.png" alt="" class="ast">
                CÉLESTE
            </h1>

            <img src="photos/c232435498f0183243df01b113a11bbe.jpg" alt="" class="photo moitie-haut">
            <img src="photos/c232435498f0183243df01b113a11bbe.jpg" alt="" class="photo moitie-bas">
            <h1 class="nom nom-fanny">
                <img src="photos/Vector.png" alt="" class="ast">
                FANNY
            </h1>

            <div class="match-message" id="texte-match">
                BRAVO LES<br>LESBIENNES !!!
            </div>

            <img src="photos/star.png" alt="" class="etoile">
        </div>

        <div class="actions">
            <div id="btn-gauche"><img src="photos/content_cutBLUE.png" alt=""></div>
            <div id="btn-reset"><img src="photos/east.png" alt=""></div>
            <div id="btn-droite">
                <svg class="coeur-svg" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="tabbar">
        <div id="ciseaux-tab"><img src="photos/content_cut.png" alt=""></div>
        <div><img src="photos/location_on.png" alt=""></div>
        <div><img src="photos/chat_bubble.png" alt=""></div>
        <div><img src="photos/account_circle.png" alt=""></div>
        <div><img src="photos/dehaze.png" alt=""></div>
    </div>

    <script>
        const carte = document.getElementById('carte-photo');
        const btnGauche = document.getElementById('btn-gauche');
        const btnDroite = document.getElementById('btn-droite');
        const btnReset = document.getElementById('btn-reset');
        const coeur = document.querySelector('.coeur-svg');
        const texteMatch = document.getElementById('texte-match');
        const ciseauxTab = document.getElementById('ciseaux-tab');

        btnGauche.addEventListener('click', () => {
            carte.classList.add('decoupe');
            coeur.classList.remove('rempli');
            texteMatch.classList.remove('visible');
        });

        btnDroite.addEventListener('click', () => {
            coeur.classList.toggle('rempli');
            texteMatch.classList.toggle('visible');
        });

        btnReset.addEventListener('click', () => {
            carte.classList.remove('decoupe');
            coeur.classList.remove('rempli');
            texteMatch.classList.remove('visible');
        });

        ciseauxTab.addEventListener('click', () => {
            ciseauxTab.classList.remove('anime-ciseaux');
            void ciseauxTab.offsetWidth;
            ciseauxTab.classList.add('anime-ciseaux');
        });
    </script>

</body>
</html>
