<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le profil - Lynn</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-profile">

    <!-- ÉTAPE 1 : Boutons du haut -->
    <header class="top-bar">
        <button class="btn btn-cancel">Annuler</button>
        <button class="btn btn-done">Terminé</button>
    </header>

    <!-- Onglets Modifier / Voir -->
    <nav class="tabs">
        <div class="tab active">Modifier</div>
        <div class="tab">Voir</div>
    </nav>

    <p class="pronouns">Tu utilises les pronoms elle</p>

    <!-- ÉTAPE 2 : Photo de profil + éléments superposés -->
    <section class="profile-photo-container">
        <span class="asterisk">*</span>
        
        <!-- MODIFIE LE CHEMIN DE TA PHOTO CI-DESSOUS -->
        <img src="IMAGES/Profile pic_lynn.png" alt="Photo de profil de Lynn" class="profile-pic">
        
        <h1 class="profile-name">LYNN</h1>
    </section>

    <!-- ÉTAPE 3 : Carte Bio -->
    <section class="bio-card">
        <p class="bio-intro">Je suis dingue de</p>
        <p class="bio-text">POKÉMON, HELLO KITTY &amp; MON CHAT ^^</p>
    </section>

    <!-- ÉTAPE 4 : Grille d'informations -->
    <section class="info-grid">
        <!-- Ligne 1 (4 colonnes) -->
        <div class="info-row-4">
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/Group 7.png" alt=""> <span>23</span>
            </div>
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/Group 10.png" alt=""> <span>168 cm</span>
            </div>
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/Group 5.png" alt=""> <span>Nice</span>
            </div>
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/Group 8.png" alt=""> <span>Ouverte à-</span>
            </div>
        </div>

        <!-- Ligne 2 (2 colonnes) -->
        <div class="info-row-2">
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/trip.png" alt=""> <span>Graphisme</span>
            </div>
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/mystery.png" alt=""> <span>Cherche une relation sérieuse</span>
            </div>
        </div>

        <!-- Ligne 3 (2 colonnes) -->
        <div class="info-row-2">
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/bungalow.png" alt=""> <span>Paris</span>
            </div>
            <div class="info-cell">
                <!-- MODIFIE L'ICÔNE CI-DESSOUS -->
                <img src="IMAGES/globe.png" alt=""> <span>Guadeloupéenne</span>
            </div>
        </div>
    </section>

    <!-- BARRE DE NAVIGATION DU BAS (Tes icônes sont déjà placées) -->
    <div class="tabbar">
        <img src="IMAGES/content_cut.png" alt="ciseaux">
        <img src="IMAGES/location_on.png" alt="localisation">
        <img src="IMAGES/chat_bubble.png" alt="message">
        <a href="../Page%20Utilisateur/index.html" aria-label="Ouvrir le profil"><img src="IMAGES/account_circle.png" alt="compte"></a>
        <img src="IMAGES/dehaze.png" alt="menu">
    </div>

</body>
</html>
